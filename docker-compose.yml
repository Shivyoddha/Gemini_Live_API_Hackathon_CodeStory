version: "3.9"

services:
  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/session
      - NEXT_PUBLIC_WS_BACKEND_HTTP=http://websocket-server:8000
      - NEXT_PUBLIC_INGEST_BACKEND=http://ingestion-service:8001
    depends_on:
      - websocket-server
      - ingestion-service
    networks:
      - codestory-net
    labels:
      com.datadoghq.ad.autoscale: "true"

  # ─── WebSocket Server (Gemini Live Bridge) ────────────────────────────────
  websocket-server:
    build:
      context: ./backend/websocket_server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - SPANNER_INSTANCE_ID=${SPANNER_INSTANCE_ID}
      - SPANNER_DATABASE_ID=${SPANNER_DATABASE_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./secrets/gcp-key.json}:/secrets/gcp-key.json:ro
      - /tmp/codestory_sessions:/tmp/codestory_sessions
    networks:
      - codestory-net

  # ─── Ingestion Service ────────────────────────────────────────────────────
  ingestion-service:
    build:
      context: ./backend/ingestion_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - SPANNER_INSTANCE_ID=${SPANNER_INSTANCE_ID}
      - SPANNER_DATABASE_ID=${SPANNER_DATABASE_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./secrets/gcp-key.json}:/secrets/gcp-key.json:ro
    networks:
      - codestory-net

networks:
  codestory-net:
    driver: bridge
