# Deploy CodeStory frontend to GitHub Pages
# Builds the React app with production env and deploys via GitHub Actions.
#
# Required GitHub secrets:
#   CODESTORY_PROD_URL  - Cloud Run backend URL (e.g. https://codestory-backend-xxx.run.app, no trailing slash)
#
# Uses existing secret:
#   GCP_PROJECT_ID  - Same project ID as backend (for VITE_PROJECT_ID)
#
# Manual setup: Repo Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set base path for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "VITE_BASE_PATH=/" >> $GITHUB_ENV
          else
            echo "VITE_BASE_PATH=/${REPO_NAME}/" >> $GITHUB_ENV
          fi

      - name: Build frontend
        working-directory: app
        env:
          VITE_API_BASE: ${{ secrets.CODESTORY_PROD_URL }}
          VITE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # PROXY_WS_URL is derived from VITE_API_BASE in config.js
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
