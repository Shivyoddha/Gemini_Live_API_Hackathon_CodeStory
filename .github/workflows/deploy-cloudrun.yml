# Deploy CodeStory backend to Google Cloud Run
# Runs on push to main and on manual trigger (workflow_dispatch).
#
# Required GitHub secrets:
#   GCP_SA_KEY    - JSON key of a service account with Cloud Run Admin + Storage + SA User
#   GCP_PROJECT_ID - Your Google Cloud project ID
#   GCS_BUCKET    - GCS bucket name for per-session docs/slides (e.g. codestory-content)
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICE_NAME: codestory-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --build-service-account=github-codestory-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --build-service-account=github-codestory-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},GCS_BUCKET=${{ secrets.GCS_BUCKET }}" \
            --no-cpu-throttling \
            --quiet
